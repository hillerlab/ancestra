[package]
name = "ancestra"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
build = "src/rust/build.rs"

[lib]
path = "src/rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bigtools = { version = "=0.5.8", default-features = false, features = ["write"] }
flate2 = "1"
genepred = "=0.0.17"
pyo3 = { version = "0.22", optional = true, features = ["extension-module", "abi3-py311"] }
numpy = { version = "0.22", optional = true }
rayon = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.34", features = ["rt", "rt-multi-thread"] }
zstd = "0.13"

[features]
python = ["pyo3", "numpy"]
